name: CBA Scraper Diario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: 

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Agrega de forma segura los archivos permitiendo que continúe si alguno no existiera
          git add cba_historico_detalle.csv cba_historico_totales.csv cba_tabla_nutricional.csv cba_errores_log.txt 2>/dev/null || true
          
          git commit -m "bot: Actualización diaria de precios, tabla nutricional y log de errores [$(date +'%Y-%m-%d')]" || echo "Sin cambios para commitear"
          git push
