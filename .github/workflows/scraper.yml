name: CBA Scraper Diario

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC (8:00 AM Argentina)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña 'Actions' en GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permiso necesario para hacer commit de los CSVs actualizados

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add cba_historico_detalle.csv cba_historico_totales.csv cba_tabla_nutricional.csv
          git commit -m "bot: Actualización diaria de precios y tabla nutricional [$(date +'%Y-%m-%d')]" || echo "Sin cambios para commitear"
          git push
